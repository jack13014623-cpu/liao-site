<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>廖偉翔官方網站</title>
<meta name="description" content="立法委員廖偉翔官方網站——重點質詢、法案推動、地方建設、攻擊澄清、最新消息。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --ink:#171414;
  --paper:#ffffff;
  --ash:#f4f2f0;
  --ash-2:#e9e6e2;
  --graphite:#5c5753;
  --line:#e4e1dd;
  --blue:#1A63C8;
  --blue-2:#134E9E;
  --navy:#112A4D;
  --navy-2:#0B1B33;
  --sky:#3CA1EE;
  --wash:#E6F0FB;
  --fg:var(--ink);
  --bg:var(--paper);
  --card:var(--ash);
  --card-2:var(--ash-2);
  --muted:var(--graphite);
  --inv-bg:var(--ink);
  --inv-fg:var(--paper);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.77,0,.18,1);
  --nav-h:64px;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fg:#f5f2ee; --bg:#141212; --card:#1f1c1b; --card-2:#2a2624; --muted:#a9a29c; --line:#2c2826;
        --inv-bg:#f5f2ee; --inv-fg:#141212;
    --blue:#5B9BE6; --blue-2:#3F82D1; --navy:#0F213D; --navy-2:#0A1628; --sky:#7DBFF4; --wash:#182A45;
  }
}
:root[data-theme="dark"]{
  --fg:#f5f2ee; --bg:#141212; --card:#1f1c1b; --card-2:#2a2624; --muted:#a9a29c; --line:#2c2826;
  --inv-bg:#f5f2ee; --inv-fg:#141212;
  --blue:#5B9BE6; --blue-2:#3F82D1; --navy:#0F213D; --navy-2:#0A1628; --sky:#7DBFF4; --wash:#182A45;
}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--fg);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
ul,ol{list-style:none}
h1,h2,h3{font-family:var(--serif);font-weight:900;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(18px,4vw,40px)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;display:flex;align-items:center;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-color:var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-weight:900;font-size:1.25rem;white-space:nowrap}
.brand small{font-family:var(--mono);font-weight:400;font-size:.7rem;letter-spacing:.14em;color:var(--muted)}
.menu{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu a{position:relative;padding:8px 12px;font-size:.92rem;font-weight:500;white-space:nowrap;color:var(--muted);transition:color .25s}
.menu a::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--fg);transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.menu a:hover,.menu a.active{color:var(--fg)}
.menu a.active::after{transform:scaleX(1);transform-origin:left}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.theme svg{width:16px;height:16px}
@media (max-width:760px){
  .nav .wrap{flex-wrap:wrap;padding-top:8px}
  .nav{height:auto;padding-bottom:6px}
  .brand{font-size:1.1rem}
  .menu{width:100%;order:3;margin:0 -18px;padding:0 14px}
  .menu a{padding:6px 9px;font-size:.86rem}
  .theme{width:30px;height:30px}
}

/* ---------- curtain transition ---------- */
.curtain{position:fixed;inset:0;z-index:100;background:var(--ink);color:#fff;display:grid;place-items:center;transform:scaleX(0);transform-origin:left;pointer-events:none}
.curtain.in{animation:cIn .55s var(--ease) forwards}
.curtain.out{animation:cOut .55s var(--ease) forwards}
@keyframes cIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes cOut{from{transform:scaleX(1);transform-origin:right}to{transform:scaleX(0);transform-origin:right}}
.curtain span{font-family:var(--serif);font-weight:900;font-size:clamp(2rem,7vw,5rem);opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s}
.curtain.in span{opacity:1;transform:none;transition-delay:.25s}

/* ---------- page + reveal ---------- */
#app{padding-top:var(--nav-h)}
@media (max-width:760px){#app{padding-top:100px}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv[data-d="1"]{transition-delay:.1s}.rv[data-d="2"]{transition-delay:.2s}.rv[data-d="3"]{transition-delay:.3s}.rv[data-d="4"]{transition-delay:.4s}
.loading{padding:80px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.85rem;letter-spacing:.12em}
.loading i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fg);margin-right:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- hero ---------- */
.hero{padding:clamp(56px,10vh,120px) 0 clamp(36px,6vh,72px);position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.6rem,8vw,6.4rem);line-height:1.05;margin:14px 0 22px}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom}
.hero h1 .w i{display:inline-block;font-style:normal;transform:translateY(110%);animation:up .8s var(--ease) forwards}
.hero .lede{max-width:34em;font-size:clamp(1.02rem,1.5vw,1.2rem);color:var(--muted)}
.hero .lede strong{color:var(--fg);font-weight:700}
@keyframes up{to{transform:none}}
.hero .ghost{position:absolute;right:-2vw;bottom:-6vw;font-family:var(--serif);font-weight:900;font-size:clamp(9rem,26vw,22rem);line-height:1;color:var(--fg);opacity:.045;pointer-events:none;user-select:none;letter-spacing:-.05em}
.hero-home{min-height:calc(100vh - var(--nav-h));display:flex;flex-direction:column;justify-content:center}
.hero-home h1{font-size:clamp(4rem,15vw,12rem);letter-spacing:-.03em}
.hero-home .sub{font-family:var(--serif);font-weight:700;font-size:clamp(1.2rem,2.6vw,1.9rem);margin-bottom:10px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:1px solid var(--fg);font-weight:500;transition:background .25s,color .25s,transform .25s}
.btn.fill{background:var(--inv-bg);color:var(--inv-fg)}
.btn:hover{transform:translateY(-2px)}
.btn.fill:hover{background:var(--fg);color:var(--bg)}
.btn.line:hover{background:var(--fg);color:var(--bg)}
.btn .ar{transition:transform .25s}.btn:hover .ar{transform:translateX(4px)}
.btn.sm{padding:8px 16px;font-size:.85rem}

/* ---------- stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--fg);border-bottom:1px solid var(--fg)}
.stats>div{padding:28px 22px 24px;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats .n{font-family:var(--serif);font-weight:900;font-size:clamp(2.6rem,5vw,4rem);line-height:1;font-variant-numeric:tabular-nums}
.stats .n small{font-size:.4em;font-weight:700;margin-left:4px}
.stats .l{margin-top:8px;font-size:.9rem;color:var(--muted);line-height:1.5}
.stats.dark{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.stats.dark>div{border-color:color-mix(in srgb,var(--inv-fg) 18%,transparent)}
.stats.dark .l{color:color-mix(in srgb,var(--inv-fg) 65%,transparent)}
@media (max-width:640px){.stats>div{border-right:0;border-bottom:1px solid var(--line)}.stats>div:last-child{border-bottom:0}}

/* ---------- sections ---------- */
.sec{padding:clamp(56px,9vh,110px) 0}
.sec.tight{padding-top:0}
.sec.slim{padding:clamp(28px,4vh,48px) 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.8rem,4vw,3rem)}
.sec-h p{max-width:30em;color:var(--muted);font-size:.95rem}
.inv{background:var(--inv-bg);color:var(--inv-fg)}
.inv .eyebrow{color:color-mix(in srgb,var(--inv-fg) 60%,transparent)}
.inv .sec-h p{color:color-mix(in srgb,var(--inv-fg) 70%,transparent)}

/* doors (home) */
.doors{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--fg)}
.door{position:relative;padding:34px 22px 28px;border-right:1px solid var(--fg);min-height:300px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate}
.door:last-child{border-right:0}
.door::before{content:"";position:absolute;inset:0;background:var(--inv-bg);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.door:hover::before{transform:none}
.door:hover{color:var(--inv-fg)}
.door h3{font-size:clamp(1.5rem,2.4vw,2rem);writing-mode:vertical-rl;letter-spacing:.12em;height:9.5em}
.door .k{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;color:var(--muted);transition:color .3s}
.door:hover .k{color:inherit}
.door p{font-size:.88rem;line-height:1.6;margin-top:14px;opacity:.85}
.door .ar{position:absolute;right:20px;bottom:24px;font-size:1.4rem;transform:translateX(-10px);opacity:0;transition:transform .4s var(--ease),opacity .4s}
.door:hover .ar{transform:none;opacity:1}
@media (max-width:900px){.doors{grid-template-columns:1fr 1fr 1fr}.door:nth-child(3){border-right:0}.door:nth-child(n+4){border-top:1px solid var(--fg)}.door:nth-child(4){border-right:1px solid var(--fg)}}
@media (max-width:560px){.doors{grid-template-columns:1fr}.door{border-right:0!important;border-top:1px solid var(--fg);min-height:0}.door:first-child{border-top:0}.door h3{writing-mode:horizontal-tb;height:auto;letter-spacing:.04em}}

/* ticker */
.ticker{border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);overflow:hidden;white-space:nowrap;padding:12px 0}
.ticker .tk{display:inline-block;animation:tk 60s linear infinite}
.ticker:hover .tk{animation-play-state:paused}
.ticker .it{display:inline-block;margin-right:48px;font-size:.92rem}
.ticker .it b{font-family:var(--mono);font-weight:500;margin-right:10px;color:var(--muted)}
@keyframes tk{to{transform:translateX(-50%)}}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:1px solid var(--fg);border-radius:999px;padding:8px 16px;font-size:.9rem;font-weight:500;transition:background .25s,color .25s;line-height:1.4}
.pill:hover,.pill.on{background:var(--inv-bg);color:var(--inv-fg)}
.pill i{font-style:normal;font-family:var(--mono);font-size:.78rem;margin-left:8px;opacity:.7}
.pill.sm{padding:5px 12px;font-size:.82rem}

/* ---------- filter bar ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0;border-top:1px solid var(--fg);border-bottom:1px solid var(--line);position:sticky;top:var(--nav-h);background:var(--bg);z-index:10}
@media (max-width:760px){.fbar{top:100px}}
.fbar select,.fbar input{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.88rem;outline:0;color:var(--fg)}
.fbar input[type=search]{min-width:200px;flex:1}
.fbar select:focus,.fbar input:focus{border-color:var(--fg)}
.fbar .cnt{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-left:auto;letter-spacing:.06em;white-space:nowrap}
.fbar .clr{font-size:.8rem;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.fbar label.pill{cursor:pointer;display:inline-flex;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--fg);border-radius:999px;overflow:hidden}
.tabs button{padding:7px 16px;font-size:.86rem;font-weight:500;transition:background .25s,color .25s}
.tabs button.on{background:var(--inv-bg);color:var(--inv-fg)}
.more{display:flex;justify-content:center;padding:30px 0}

/* ---------- expandable cards ---------- */
.xl{border-top:1px solid var(--fg)}
.x{border-bottom:1px solid var(--line);transition:background .3s}
.x:hover{background:var(--card)}
.x.open{background:var(--card)}
.x .hd{display:grid;grid-template-columns:120px 1fr 32px;gap:20px;padding:22px 0;align-items:start;cursor:pointer;width:100%;text-align:left}
.x .hd .d{font-family:var(--mono);font-size:.85rem;line-height:1.5}
.x .hd .d small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.04em;white-space:normal}
.x .hd h3{font-family:var(--sans);font-weight:700;font-size:1.08rem;line-height:1.5;margin-bottom:6px}
.x .hd .m{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--muted)}
.x .hd .m span{border:1px solid var(--line);border-radius:999px;padding:1px 9px;line-height:1.6}
.x .hd .m span.hi{border-color:var(--fg);color:var(--fg)}
.x .hd .pl{width:28px;height:28px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;font-size:1.1rem;line-height:1;transition:transform .35s var(--ease),background .25s,color .25s;justify-self:end;margin-top:4px}
.x.open .hd .pl{transform:rotate(45deg);background:var(--inv-bg);color:var(--inv-fg)}
.x .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.x.open .bd{grid-template-rows:1fr}
.x .bd>div{overflow:hidden}
.x .bdi{padding:0 0 28px 140px;display:grid;grid-template-columns:1fr 1fr;gap:22px 40px}
.x .bdi .full{grid-column:1/-1}
.x .lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.x .sum{font-size:1rem;line-height:1.8;max-width:42em}
.x ol.ls{counter-reset:n}
.x ol.ls li{position:relative;padding:7px 0 7px 30px;border-top:1px solid var(--line);font-size:.92rem;counter-increment:n}
.x ol.ls li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:9px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.x .rep{border-left:2px solid var(--fg);padding-left:14px;font-size:.92rem;color:var(--muted)}
.x ol.fu li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;align-items:baseline}
.x ol.fu li b{font-family:var(--mono);font-weight:500;font-size:.78rem;color:var(--muted)}
.x ol.fu li a{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--muted)}
.x ol.fu li a:hover{border-color:var(--fg);color:var(--fg)}
@media (max-width:760px){.x ol.fu li{grid-template-columns:1fr;gap:4px}}
.x .qt{font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.6}
.x .qt p{padding:6px 0}
.x .qt p::before{content:"「"}.x .qt p::after{content:"」"}
.x .ft{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.8rem;color:var(--muted)}
.x .ft a{border:1px solid var(--fg);border-radius:999px;padding:4px 12px;color:var(--fg);transition:background .25s,color .25s}
.x .ft a:hover{background:var(--inv-bg);color:var(--inv-fg)}
.gz{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:4px}
@media (max-width:760px){
  .x .hd{grid-template-columns:1fr 32px;gap:8px 12px}
  .x .hd .d{grid-column:1/-1}
  .x .bdi{padding-left:0;grid-template-columns:1fr}
}

/* ---------- bill rows ---------- */
.role{display:inline-block;border:1px solid var(--fg);border-radius:999px;padding:1px 10px;font-weight:500;font-size:.74rem}
.role.lead{background:var(--inv-bg);color:var(--inv-fg)}
.flow{display:flex;flex-wrap:wrap;gap:0}
.flow li{position:relative;padding:6px 26px 6px 0;font-size:.85rem}
.flow li b{font-family:var(--mono);font-weight:500;font-size:.75rem;color:var(--muted);display:block}
.flow li::after{content:"→";position:absolute;right:7px;top:8px;color:var(--muted);font-family:var(--mono)}
.flow li:last-child::after{content:none}
.flow li.last{font-weight:700}
.note{font-size:.9rem;color:var(--muted);line-height:1.75;white-space:pre-line;max-width:46em}
.lawgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.lawgrid button{background:var(--bg);padding:16px 18px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:baseline;transition:background .25s,color .25s}
.lawgrid button:hover,.lawgrid button.on{background:var(--inv-bg);color:var(--inv-fg)}
.lawgrid button span{font-size:.9rem;font-weight:500;line-height:1.4}
.lawgrid button i{font-style:normal;font-family:var(--mono);font-size:.78rem;opacity:.7;flex:none}

/* three lanes */
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.lane{background:var(--bg);padding:30px 26px}
.lane .k{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
.lane h3{font-size:1.5rem;margin:10px 0 12px}
.lane p{font-size:.92rem;color:var(--muted)}
.lane ul{margin-top:14px;font-size:.88rem}
.lane li{padding:6px 0;border-top:1px solid var(--line)}
.lane.hi{background:var(--inv-bg);color:var(--inv-fg)}
.lane.hi .k,.lane.hi p{color:color-mix(in srgb,var(--inv-fg) 65%,transparent)}
.lane.hi li{border-color:color-mix(in srgb,var(--inv-fg) 18%,transparent)}
@media (max-width:860px){.lanes{grid-template-columns:1fr}}

/* big quote block */
.big{padding:clamp(48px,8vh,96px) 0}
.big .n{font-family:var(--serif);font-weight:900;font-size:clamp(5rem,18vw,14rem);line-height:.9;letter-spacing:-.04em}
.big .t{font-size:clamp(1.1rem,2vw,1.4rem);max-width:30em;margin-top:18px}
.big .t b{font-weight:700}
.big .s{margin-top:14px;font-size:.85rem;opacity:.7}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
@media (max-width:760px){.split{grid-template-columns:1fr}}

/* ---------- local: 里 grid + site cards ---------- */
.ligrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.ligrid button{background:var(--bg);padding:14px 14px;text-align:left;transition:background .25s,color .25s;display:flex;flex-direction:column;gap:2px}
.ligrid button:hover,.ligrid button.on{background:var(--inv-bg);color:var(--inv-fg)}
.ligrid b{font-family:var(--serif);font-size:1.05rem}
.ligrid small{font-size:.74rem;opacity:.7}
.ligrid i{font-style:normal;font-family:var(--mono);font-size:.74rem;opacity:.7}
.ligrid button.hd{background:var(--card);cursor:default;justify-content:center}
.ligrid button.hd:hover{background:var(--card);color:inherit}
.ligrid button.hd b{font-size:.85rem;font-family:var(--mono);letter-spacing:.12em;font-weight:400}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.site{background:var(--card);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s var(--ease);position:relative}
.site:hover{transform:translateY(-4px)}
.site .top{padding:20px 20px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;flex:1}
.site .tags{display:flex;flex-wrap:wrap;gap:6px;font-size:.72rem}
.site .tags span{border:1px solid currentColor;border-radius:999px;padding:1px 9px;opacity:.75}
.site .tags span.li{opacity:1;background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.site h3{font-family:var(--sans);font-weight:700;font-size:1.02rem;line-height:1.5}
.site .meta{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:auto}
.site .meta b{font-weight:500;color:var(--fg)}
.site .thx{font-size:.8rem;color:var(--muted)}
.site .thx b{color:var(--fg);font-weight:500}
.site .cover{aspect-ratio:16/10;background:var(--card-2);overflow:hidden;position:relative}
.site .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.site:hover .cover img{transform:scale(1.04)}
.site .cover .pc{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:.7rem;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:4px}
.site .det{border-top:1px solid var(--line);padding:18px 20px 22px;display:none}
.site.open .det{display:block}
.site.open{grid-column:1/-1;transform:none}
.site.open .cover{aspect-ratio:21/6}
.site .tl2,#gm .tl2{position:relative;padding-left:22px}
.site .tl2::before,#gm .tl2::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--fg)}
.site .ev,#gm .ev{position:relative;padding:8px 0 22px}
.site .ev::before,#gm .ev::before{content:"";position:absolute;left:-22px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--fg)}
.site .ev .d,#gm .ev .d{font-family:var(--mono);font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.site .ev .d small,#gm .ev .d small{font-size:.74rem;color:var(--muted)}
.site .ev .t,#gm .ev .t{font-weight:500;margin:4px 0}
.site .ev .c,#gm .ev .c{border-left:2px solid var(--fg);padding:6px 12px;margin:8px 0;font-size:.9rem;white-space:pre-line;max-width:46em}
.site .ev .c b,#gm .ev .c b{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;display:block;color:var(--muted);margin-bottom:2px}
.site .ev .nt,#gm .ev .nt{font-size:.85rem;color:var(--muted);white-space:pre-line;max-width:46em;margin:6px 0}
.site .ph,#gm .ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:10px}
.site .ph button,#gm .ph button{aspect-ratio:4/3;overflow:hidden;background:var(--card-2);border-radius:3px}
.site .ph img,#gm .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.site .ph button:hover img,#gm .ph button:hover img{transform:scale(1.06)}
.site .ph .m,#gm .ph .m{display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
@media (max-width:900px){.sites{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.sites{grid-template-columns:1fr}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;place-items:center;padding:20px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:90vh;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .cap{position:absolute;left:20px;bottom:16px;color:#fff;font-family:var(--mono);font-size:.78rem;opacity:.8;max-width:80vw}
.lb .x2{position:absolute;right:20px;top:14px;color:#fff;font-size:2rem;line-height:1}
.lb .pv,.lb .nx{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:2.2rem;padding:20px;opacity:.75}
.lb .pv{left:6px}.lb .nx{right:6px}

/* process strip */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--fg)}
.step{padding:26px 22px;border-right:1px solid var(--fg)}
.step:last-child{border-right:0}
.step .k{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
.step h3{font-size:1.3rem;margin:8px 0 6px}
.step p{font-size:.88rem;color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}.step:nth-child(2){border-right:0}.step:nth-child(n+3){border-top:1px solid var(--fg)}}
@media (max-width:420px){.steps{grid-template-columns:1fr}.step{border-right:0!important;border-top:1px solid var(--fg)}.step:first-child{border-top:0}}

/* clarify: attack vs fact */
.vs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:22px;border:1px solid var(--fg)}
.vs>div{padding:34px 30px}
.vs .atk{background:var(--inv-bg);color:var(--inv-fg)}
.vs .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;opacity:.65}
.vs h3{font-size:1.35rem;margin:10px 0 12px}
.vs blockquote{font-family:var(--serif);font-weight:700;font-size:1.15rem;line-height:1.5;margin:8px 0}
.vs blockquote cite{display:block;font-family:var(--mono);font-style:normal;font-weight:400;font-size:.75rem;opacity:.65;margin-top:6px}
.vs p{font-size:.92rem}
.vs .fact p{color:var(--muted)}
.vs .fact ul{margin-top:12px}
.vs .fact li{padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;display:flex;gap:10px}
.vs .fact li::before{content:"—";flex:none;font-family:var(--mono)}
.vs .d{font-family:var(--mono);font-size:.78rem;opacity:.65;margin-top:14px}
.vs .src{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;opacity:.55;margin-bottom:8px}
.vs .fact li a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.clue{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clue .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;opacity:.65;margin-right:6px}
.clue a{font-size:.78rem;line-height:1.3;padding:5px 11px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:inherit;transition:background .2s,color .2s}
.clue a::before{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;opacity:.6;margin-right:6px}
.clue a.in::before{content:"站內"}
.clue a.ex::before{content:"新聞"}
.clue a.in{border-color:var(--fg)}
.clue a:hover{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.vs .atk .clue{border-top-color:color-mix(in srgb,var(--inv-fg) 25%,transparent)}
.vs .atk .clue a{border-color:color-mix(in srgb,var(--inv-fg) 40%,transparent)}
.vs .atk .clue a:hover{background:var(--inv-fg);color:var(--inv-bg);border-color:var(--inv-fg)}
@media (max-width:760px){.clue a{font-size:.74rem}}
@media (max-width:760px){.vs{grid-template-columns:1fr}}

/* news list */
.news{border-top:1px solid var(--fg)}
.ni{display:grid;grid-template-columns:130px 1fr 140px;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);align-items:baseline;transition:padding-left .3s var(--ease)}
.ni:hover{padding-left:10px}
.ni .d{font-family:var(--mono);font-size:.88rem}
.ni h3{font-family:var(--sans);font-weight:700;font-size:1.08rem;line-height:1.5}
.ni p{font-size:.88rem;color:var(--muted);margin-top:4px}
.ni .o{font-size:.8rem;color:var(--muted);text-align:right}
.ni a.h{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.mh{font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;color:var(--muted);padding:32px 0 12px}
@media (max-width:760px){.ni{grid-template-columns:1fr;gap:4px}.ni .o{text-align:left}}

/* footer */
footer{border-top:1px solid var(--fg);padding:48px 0 40px;margin-top:40px}
footer .wrap{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}
footer .name{font-family:var(--serif);font-weight:900;font-size:2rem}
footer .meta{font-size:.85rem;color:var(--muted);margin-top:6px;max-width:40em}
footer .soc{display:flex;gap:8px;flex-wrap:wrap}
footer .soc a{border:1px solid var(--fg);border-radius:999px;padding:6px 14px;font-size:.82rem;transition:background .25s,color .25s}
footer .soc a:hover{background:var(--inv-bg);color:var(--inv-fg)}
footer .fine{grid-column:1/-1;font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;border-top:1px solid var(--line);padding-top:16px;line-height:1.8}
@media (max-width:640px){footer .wrap{grid-template-columns:1fr}}

.next{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:40px 0;border-top:1px solid var(--fg)}
.next .lab{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
.next a{font-family:var(--serif);font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);display:inline-flex;align-items:center;gap:14px}
.next a .ar{transition:transform .35s var(--ease)}.next a:hover .ar{transform:translateX(10px)}

@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  .hero h1 .w i{transform:none;animation:none}
  .curtain{display:none}
  .ticker .tk{animation:none}
  *{transition-duration:.01ms!important}
}
/* ── 政績地圖 ── */
.gmc{display:grid;grid-template-columns:1.15fr 1fr;background:var(--inv-bg);color:var(--inv-fg);border-radius:4px;overflow:hidden;min-height:420px;cursor:pointer;position:relative}
.gmc .pv{position:relative;min-height:320px;overflow:hidden;background:
  linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/40px 40px}
.gmc .pv svg{position:absolute;inset:6%;width:88%;height:88%}
.gmc .pv .dot{transform-origin:center;animation:gmTw 3s ease-in-out infinite}
.gmc .pv .dot:nth-child(3n){animation-delay:-1s}.gmc .pv .dot:nth-child(3n+1){animation-delay:-2s}
@keyframes gmTw{0%,100%{opacity:.45}50%{opacity:1}}
.gmc .pv .scan{position:absolute;left:0;right:0;top:-20%;height:20%;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.12));border-bottom:1px solid rgba(255,255,255,.35);animation:gmScan 5s linear infinite;pointer-events:none}
@keyframes gmScan{to{top:100%}}
.gmc .pv::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px rgba(0,0,0,.55)}
.gmc .tx{padding:40px 40px 36px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.gmc .tx .eyebrow{color:inherit;opacity:.7}
.gmc .tx h2{font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.25;font-weight:600;margin:0;text-wrap:balance}
.gmc .tx p{opacity:.8;max-width:34em;margin:0;font-size:.95rem;line-height:1.7}
.gmc .tx .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.gmc .tx .btn{border-color:var(--inv-fg);color:var(--inv-fg)}
.gmc .tx .btn.fill{background:var(--inv-fg);color:var(--inv-bg)}
.gmc .tx .mini{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;opacity:.65}
.gmc .tx .lis{display:flex;flex-wrap:wrap;gap:6px}
.gmc .tx .lis button{font-family:var(--mono);font-size:.72rem;padding:4px 9px;border:1px solid rgba(255,255,255,.35);border-radius:2px;color:inherit;opacity:.85}
.gmc .tx .lis button:hover{background:var(--inv-fg);color:var(--inv-bg)}
@media (max-width:820px){.gmc{grid-template-columns:1fr}.gmc .pv{min-height:260px}.gmc .tx{padding:26px 22px 28px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gmc .tx{background:#0b0a0a;color:#f5f2ee;border:1px solid var(--line)}}
:root[data-theme="dark"] .gmc .tx{background:#0b0a0a;color:#f5f2ee;border:1px solid var(--line)}

#gm{position:fixed;inset:0;z-index:90;background:#0b0a0a;display:none;overflow:hidden;
  --fg:#f5f2ee;--bg:#0b0a0a;--card:#161414;--card-2:#211e1d;--muted:#a9a29c;--line:#2a2624;--inv-bg:#f5f2ee;--inv-fg:#0b0a0a;color:var(--fg)}
#gm.on{display:block}
#gm canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gm .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;pointer-events:none;z-index:3}
#gm .crumbs{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;pointer-events:auto;background:rgba(11,10,10,.6);padding:6px 10px;border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(6px);max-width:calc(100% - 70px)}
#gm .crumbs button{color:var(--fg);opacity:.7;text-decoration:underline;text-underline-offset:3px}
#gm .crumbs button:hover{opacity:1}
#gm .crumbs i{opacity:.4;font-style:normal}
#gm .crumbs .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gm .x{pointer-events:auto;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;font-size:1.4rem;line-height:1;color:var(--fg);background:rgba(11,10,10,.6);backdrop-filter:blur(6px)}
#gm .x:hover{background:var(--inv-bg);color:var(--inv-fg)}
#gm .side{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;background:rgba(11,10,10,.86);border-left:1px solid var(--line);backdrop-filter:blur(10px);overflow-y:auto;padding:64px 26px 40px;z-index:2;transform:translateX(30px);opacity:0;transition:transform .8s var(--ease),opacity .8s}
#gm.ready .side{transform:none;opacity:1}
#gm .side .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
#gm .side h2{font-family:var(--serif);font-size:1.45rem;line-height:1.3;margin:6px 0 10px;font-weight:600;text-wrap:balance}
#gm .side p{font-size:.9rem;line-height:1.75;color:var(--muted);margin:6px 0}
#gm .side p b{color:var(--fg);font-weight:500}
#gm .side .src{font-size:.72rem;font-family:var(--mono);margin-top:22px;opacity:.7}
#gm .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:14px 0}
#gm .nums div{background:var(--bg);padding:12px 10px}
#gm .nums b{display:block;font-family:var(--mono);font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
#gm .nums small{font-size:.7rem;color:var(--muted);letter-spacing:.06em}
#gm .tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
#gm .tags span{font-family:var(--mono);font-size:.7rem;padding:3px 8px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
#gm .ls{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
#gm .ls li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
#gm .ls li:hover{background:rgba(245,242,238,.06)}
#gm .ls li b{font-weight:500;font-size:.92rem}
#gm .ls li small{color:var(--muted);font-size:.74rem}
#gm .ls li em{font-style:normal;font-family:var(--mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
#gm .det{margin-top:8px}
#gm .btn.sm{font-size:.8rem;padding:8px 14px}
#gm .bot{position:absolute;left:18px;bottom:16px;right:460px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--mono);font-size:.72rem;color:var(--muted);z-index:3;pointer-events:none}
#gm .bot>*{pointer-events:auto}
#gm .lg{display:inline-flex;align-items:center;gap:6px}
#gm .lg i{width:9px;height:9px;border-radius:50%;background:var(--fg);display:inline-block}
#gm .lg i.m{box-shadow:0 0 0 3px rgba(245,242,238,.25)}
#gm .lg i.o{background:none;border:1px solid var(--fg)}
#gm .play,#gm .zoom button{border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:2px;background:rgba(11,10,10,.6);font-family:var(--mono);font-size:.74rem}
#gm .play:hover,#gm .zoom button:hover{background:var(--inv-bg);color:var(--inv-fg)}
#gm .zoom{display:inline-flex;gap:4px}
#gm .zoom button{width:32px;padding:6px 0}
#gm .yr{position:absolute;left:24px;top:70px;font-family:var(--mono);font-size:clamp(2.4rem,7vw,5rem);font-weight:300;letter-spacing:.04em;opacity:.28;pointer-events:none;z-index:1;font-variant-numeric:tabular-nums}
#gm .tip{position:absolute;display:none;transform:translate(14px,-120%);background:var(--inv-bg);color:var(--inv-fg);font-family:var(--mono);font-size:.74rem;padding:5px 9px;border-radius:2px;pointer-events:none;z-index:4;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){
  #gm .side{top:auto;left:0;right:0;width:100%;height:52%;border-left:0;border-top:1px solid var(--line);padding:18px 18px 30px;transform:translateY(30px)}
  #gm .bot{right:18px;bottom:calc(52% + 10px)}
  #gm .yr{top:auto;bottom:calc(52% + 50px);left:18px;font-size:2.2rem}
  #gm .nums b{font-size:1.15rem}
}

/* ── 藍色點綴（臺中藍 / 海軍藍 / 天空藍） ── */
.eyebrow{color:var(--blue)}
.brand small{color:var(--blue)}
.menu a::after{background:var(--blue)}
.btn.fill{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.fill:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.line:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.hero h1 .w.hl i{color:var(--blue)}
.hero .sub em{font-style:normal;color:var(--blue)}
.hero .lede strong{background:linear-gradient(transparent 60%,var(--wash) 60%)}
.stats .n span[data-count]{color:var(--blue)}
.stats .n small{color:var(--fg)}
.stats.dark .n span[data-count]{color:var(--sky)}
.stats.dark .n small{color:#fff}
.stats.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.stats.dark>div{border-color:rgba(255,255,255,.16)}
.stats.dark .l{color:rgba(255,255,255,.68)}
.inv{background:var(--navy);color:#fff}
.inv .eyebrow{color:var(--sky)}
.inv .sec-h p{color:rgba(255,255,255,.72)}
.ticker .it b{color:var(--blue)}
.door .k{color:var(--blue)}
.door::before{background:var(--navy)}
.door:hover{color:#fff}
.door:hover .k{color:var(--sky)}
.pill:hover,.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.x .hd .m span.hi{border-color:var(--blue);color:var(--blue)}
.lane.hi{background:var(--blue);color:#fff}
.step .k,.next .lab{color:var(--blue)}
.next a:hover{color:var(--blue)}
.loading i{background:var(--blue)}
.gmc{background:radial-gradient(120% 90% at 0% 0%,#1b3f75 0%,var(--navy) 45%,var(--navy-2) 100%);color:#fff}
.gmc .pv{color:var(--sky)}
.gmc .tx .btn{border-color:#fff;color:#fff}
.gmc .tx .btn.fill{background:var(--sky);border-color:var(--sky);color:var(--navy-2)}
.gmc .tx .btn.fill:hover{background:#fff;border-color:#fff}
/* 政績地圖：交錯排版（地圖向左出血、鑽到統計列下方；文字卡浮在地圖右下） */
.stats{position:relative;z-index:2;background:var(--bg)}
.gmsec{padding-top:0;margin-top:calc(-1 * clamp(56px,9vh,110px) - 52px);position:relative;z-index:1}
.gmc{display:block;position:relative;background:none;color:var(--fg);border-radius:0;overflow:visible;min-height:0;padding-bottom:64px;cursor:default}
.gmc .pv{position:relative;cursor:pointer;margin-left:calc(50% - 50vw);width:calc(50vw + 26%);height:clamp(440px,46vw,660px);min-height:0;border-radius:0 4px 4px 0;color:var(--sky);
  background:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/40px 40px,

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,h) => h.startsWith('#/') ? `<a href="${h}" data-nav>${t}</a>` : `<a href="${h}" target="_blank" rel="noopener">${t}</a>`);
const num = n => Number(n).toLocaleString('zh-Hant-TW');
const words = t => { let hl=false; return t.split('').map((ch,i)=>{ if(ch==='【'){hl=true;return '';} if(ch==='】'){hl=false;return '';} if(ch==='|'){return '<br>';} return `<span class="w${hl?' hl':''}"><i style="animation-delay:${(i*0.035).toFixed(3)}s">${esc(ch)}</i></span>`; }).join(''); };
const photo = (src, pos, alt, m) => `<div class="ph" style="--pos:${pos||'55% 35%'}${m?`;--pos-m:${m}`:''}"><img src="img/${src}.jpg" srcset="img/${src}-s.jpg 800w, img/${src}.jpg 1600w" sizes="(max-width:760px) 100vw, 60vw" alt="${esc(alt||'')}" loading="eager" decoding="async"></div>`;
const hero = (eyebrow, title, lede, ghost, ph) => `
  <section class="hero${ph?' hp':''}">${ph||''}<div class="wrap">
    <div class="eyebrow rv">${esc(eyebrow)}</div>
    <h1>${words(title)}</h1>
    <p class="lede rv" data-d="2">${lede}</p>
  </div>${ghost?`<div class="ghost">${esc(ghost)}</div>`:''}</section>`;
const stats = (items, dark) => `<section class="sec tight"><div class="wrap"><div class="stats ${dark?'dark':''} rv">${
  items.map(([n,l,unit])=>`<div><div class="n"><span data-count="${n}">${num(n)}</span>${unit?`<small>${esc(unit)}</small>`:''}</div><div class="l">${l}</div></div>`).join('')
}</div></div></section>`;
const nextLink = (href, label) => `<section class="wrap next rv"><div><div class="lab">下一頁</div><a href="${href}" data-nav>${esc(label)} <span class="ar">→</span></a></div></section>`;
const loading = () => `<div class="wrap loading"><i></i>載入資料中</div>`;
const TITLES = {home:'廖偉翔',interp:'重點質詢',bills:'法案推動',local:'地方建設',clarify:'攻擊澄清',news:'最新消息'};
const qs = () => { const q=location.hash.split('?')[1]||''; return Object.fromEntries(new URLSearchParams(q)); };
const norm = s => String(s||'').toLowerCase();
const opt = (arr, cur, all) => `<option value="">${all}</option>` + arr.map(([v,n])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}${n!=null?`（${num(n)}）`:''}</option>`).join('');
const toggleX = (list) => list.addEventListener('click',e=>{ const h=e.target.closest('.hd'); if(!h) return; const x=h.parentElement; const o=x.classList.toggle('open'); h.setAttribute('aria-expanded',o); });

const app = document.getElementById('app');
const curtain = document.getElementById('curtain');
const curtainText = document.getElementById('curtainText');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let current = null, busy = false, renderSeq = 0;

function routeKey(){ const h=location.hash.replace(/^#\/?/,'').split('?')[0]; return pages[h]?h:'home'; }

async function render(key){
  const seq = ++renderSeq;
  document.title = key==='home' ? '廖偉翔官方網站' : `${TITLES[key]}｜廖偉翔官方網站`;
  document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')===`#/${key}`));
  let out;
  try{ out = pages[key](); if(out && typeof out.then==='function'){ app.innerHTML = loading(); out = await out; } }
  catch(e){ console.error(e); out = `<div class="wrap loading">資料載入失敗，請重新整理。</div>`; }
  if(seq!==renderSeq) return;
  app.innerHTML = (typeof out==='string' ? out : out.html) + footer();
  window.scrollTo({top:0,behavior:'instant'});
  if(out && out.mount) out.mount();
  observe();
  current = key;
}

function go(key){
  if(busy) return;
  if(reduce || current===null){ render(key); return; }
  busy = true;
  curtainText.textContent = TITLES[key];
  curtain.classList.remove('out'); curtain.classList.add('in');
  setTimeout(()=>{ render(key); curtain.classList.remove('in'); curtain.classList.add('out'); }, 600);
  setTimeout(()=>{ busy=false; }, 1150);
}

window.addEventListener('hashchange', ()=>{ const k=routeKey(); if(k!==current) go(k); });
document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-nav]'); if(!a) return;
  const href = a.getAttribute('href'); if(!href.startsWith('#/')) return;
  e.preventDefault();
  const k = href.replace('#/','').split('?')[0]||'home';
  if(k===current){ window.scrollTo({top:0,behavior:'smooth'}); return; }
  history.pushState(null,'',href); go(pages[k]?k:'home');
});
window.addEventListener('popstate', ()=>{ const k=routeKey(); if(k!==current) go(k); });


/* ── 政績地圖（Canvas 2D，零外部函式庫）── */
function initMap(M, D, {detail, byId, S}){
  const RM = reduce;
  const LI = M.li; const lat0 = LI[0].c[1]; const KX = 111320*Math.cos(lat0*Math.PI/180), KY = 110540;
  const W = ([lon,lat]) => [(lon-LI[0].c[0])*KX, -(lat-LI[0].c[1])*KY];
  LI.forEach(l=>{ l.w = l.ring.map(W); l.wc = W(l.c); const xs=l.w.map(p=>p[0]), ys=l.w.map(p=>p[1]); l.bb=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; l.sites=[]; });
  const liByName = {}; LI.forEach(l=>liByName[l.name]=l);
  const pts = []; let placed=0, approx=0;
  D.sites.forEach(s=>{ const m=M.sites[s.id]; if(!m) return; const [x,y]=W([m[0],m[1]]); const li=liByName[s.li]||LI.find(l=>pip([x,y],l.w)); const p={s,x,y,m:m[2],ap:m[2]==='li',li,t:Date.parse(s.first)}; pts.push(p); if(li) li.sites.push(p); placed++; if(p.ap) approx++; });
  function pip([x,y],ring){ let inside=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const [xi,yi]=ring[i],[xj,yj]=ring[j]; if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside; } return inside; }
  const all = LI.reduce((b,l)=>[Math.min(b[0],l.bb[0]),Math.min(b[1],l.bb[1]),Math.max(b[2],l.bb[2]),Math.max(b[3],l.bb[3])],[1e9,1e9,-1e9,-1e9]);
  const T0 = Math.min(...pts.map(p=>p.t)), T1 = Math.max(...pts.map(p=>p.t));

  /* 預覽 SVG（頁內卡片） */
  const pv = document.getElementById('gmPv');
  if(pv){
    const pad=50, vb=`${all[0]-pad} ${all[1]-pad} ${all[2]-all[0]+pad*2} ${all[3]-all[1]+pad*2}`;
    let bmOn=true; try{ bmOn = localStorage.getItem('liao.bm')!=='0'; }catch(e){}
    pv.classList.toggle('nobm',!bmOn);
    const bm0=W([120.508,24.228]), bm1=W([120.735,24.096]); /* img/basemap.jpg 的經緯界（OSM z14 拼接） */
    pv.innerHTML = `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <image class="bm" href="img/basemap.jpg" x="${bm0[0].toFixed(0)}" y="${bm0[1].toFixed(0)}" width="${(bm1[0]-bm0[0]).toFixed(0)}" height="${(bm1[1]-bm0[1]).toFixed(0)}" preserveAspectRatio="none"/>
      ${LI.map(l=>`<path d="M${l.w.map(p=>p[0].toFixed(0)+' '+p[1].toFixed(0)).join('L')}Z" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
      ${pts.map(p=>`<circle class="dot" cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="${p.s.n>1?34:22}" fill="currentColor" opacity="${p.s.n>1?.95:.6}"/>`).join('')}
    </svg><span class="scan"></span><button type="button" class="bmt" aria-pressed="${bmOn}">底圖 <b>${bmOn?'開':'關'}</b></button><span class="osm">© OpenStreetMap 貢獻者</span>`;
    const bmt=pv.querySelector('.bmt'); bmt.addEventListener('click',e=>{ e.stopPropagation(); bmOn=!bmOn; pv.classList.toggle('nobm',!bmOn); bmt.setAttribute('aria-pressed',bmOn); bmt.querySelector('b').textContent=bmOn?'開':'關'; try{ localStorage.setItem('liao.bm',bmOn?'1':'0'); }catch(e){} });
  }
  const meth = M.methods||{}; const precise = (meth.door||0)+(meth.near||0)+(meth.interp||0)+(meth.poi||0), byRoad=(meth.cross||0)+(meth.street||0)+(meth.road||0);

  /* overlay DOM */
  let gm = document.getElementById('gm');
  if(gm) gm.remove();
  {
    gm = document.createElement('div'); gm.id='gm'; gm.setAttribute('role','dialog'); gm.setAttribute('aria-label','政績地圖');
    gm.innerHTML = `<canvas></canvas><div class="yr" id="gmYr"></div>
      <div class="top"><div class="crumbs" id="gmCrumbs"></div><button class="x" id="gmClose" aria-label="關閉地圖">×</button></div>
      <aside class="side" id="gmSide"></aside>
      <div class="bot"><span class="lg"><i></i>會勘地點</span><span class="lg"><i class="m"></i>多次追蹤</span><span class="lg"><i class="o"></i>里內約略位置</span><button class="play" id="gmPlay">▶ 播放時間軸</button><span class="zoom"><button id="gmZi" aria-label="放大">＋</button><button id="gmZo" aria-label="縮小">－</button></span></div>
      <div class="tip" id="gmTip"></div>`;
    document.body.appendChild(gm);
  }
  const cv = gm.querySelector('canvas'), ctx = cv.getContext('2d'), side=document.getElementById('gmSide'), crumbs=document.getElementById('gmCrumbs'), tip=document.getElementById('gmTip'), yr=document.getElementById('gmYr'), playBtn=document.getElementById('gmPlay');
  let Wd=0, Ht=0, dpr=1; const cam={x:0,y:0,z:1}; let anim=null, drawP=1, openedAt=0, raf=0, hover=null, hoverLi=null, sel=null, focus=null, lvl=0, play=null, dragging=null, moved=false;
  const sideW = () => innerWidth>820 ? Math.min(440, innerWidth) : 0;
  const sideH = () => innerWidth>820 ? 0 : Ht*0.52;
  function resize(){ dpr=Math.min(2,devicePixelRatio||1); Wd=gm.clientWidth; Ht=gm.clientHeight; cv.width=Wd*dpr; cv.height=Ht*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); if(lvl===0) fit(all,false); else if(focus) fit(focus.bb,false); req(); }
  const sx = x => (x-cam.x)*cam.z + (Wd-sideW())/2, sy = y => (y-cam.y)*cam.z + (Ht-sideH())/2;
  const wx = X => (X-(Wd-sideW())/2)/cam.z + cam.x, wy = Y => (Y-(Ht-sideH())/2)/cam.z + cam.y;
  function fit(bb,tween=true){ const pad=innerWidth>820?70:30; const aw=Wd-sideW()-pad*2, ah=Ht-sideH()-pad*2; const z=Math.min(aw/(bb[2]-bb[0]), ah/(bb[3]-bb[1])); const to={x:(bb[0]+bb[2])/2,y:(bb[1]+bb[3])/2,z}; if(!tween||RM){ Object.assign(cam,to); req(); return; } const from={...cam}, t0=performance.now(), dur=900; anim=now=>{ const p=Math.min(1,(now-t0)/dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; cam.x=from.x+(to.x-from.x)*e; cam.y=from.y+(to.y-from.y)*e; cam.z=from.z*Math.pow(to.z/from.z,e); if(p>=1) anim=null; }; req(); }
  function req(){ if(!raf) raf=requestAnimationFrame(frame); }
  function frame(now){ raf=0; if(anim) anim(now); if(!RM && drawP<1) drawP=Math.min(1,(now-openedAt)/1400); if(play){ play.cur=Math.min(T1, play.cur + (now-play.last)*play.speed); play.last=now; yr.textContent=new Date(play.cur).toISOString().slice(0,7).replace('-','.'); if(play.cur>=T1){ play=null; playBtn.textContent='▶ 播放時間軸'; } } draw(now); if(anim||drawP<1||play||(!RM && gm.classList.contains('on'))) req(); }
  const C='#f5f2ee';
  function draw(now){
    ctx.clearRect(0,0,Wd,Ht); ctx.fillStyle='#0b0a0a'; ctx.fillRect(0,0,Wd,Ht);
    /* 格線 */
    const step = cam.z*500 > 40 ? 500 : 2000; ctx.strokeStyle='rgba(245,242,238,.06)'; ctx.lineWidth=1; ctx.beginPath();
    for(let x=Math.floor(wx(0)/step)*step; x<wx(Wd); x+=step){ const X=Math.round(sx(x))+.5; ctx.moveTo(X,0); ctx.lineTo(X,Ht); }
    for(let y=Math.floor(wy(0)/step)*step; y<wy(Ht); y+=step){ const Y=Math.round(sy(y))+.5; ctx.moveTo(0,Y); ctx.lineTo(Wd,Y); }
    ctx.stroke();
    if(!RM){ const Y=((now/40)%(Ht+200))-100; const g=ctx.createLinearGradient(0,Y-60,0,Y); g.addColorStop(0,'rgba(245,242,238,0)'); g.addColorStop(1,'rgba(245,242,238,.09)'); ctx.fillStyle=g; ctx.fillRect(0,Y-60,Wd,60); ctx.fillStyle='rgba(245,242,238,.25)'; ctx.fillRect(0,Y,Wd,1); }
    /* 里界 */
    LI.forEach(l=>{ const isF=focus===l, isH=hoverLi===l && lvl===0; const n=Math.max(2,Math.floor(l.w.length*drawP)); ctx.beginPath(); for(let i=0;i<n;i++){ const p=l.w[i]; i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1])); } if(drawP>=1) ctx.closePath();
      if(isF||isH){ ctx.fillStyle=isF?'rgba(245,242,238,.07)':'rgba(245,242,238,.05)'; ctx.fill(); }
      ctx.strokeStyle= lvl===0 ? (isH?'rgba(245,242,238,.95)':'rgba(245,242,238,.42)') : (isF?'rgba(245,242,238,.95)':'rgba(245,242,238,.14)'); ctx.lineWidth=isF||isH?1.5:1; ctx.stroke(); });
    /* 里名 */
    if(cam.z>0.045 && drawP>=1){ ctx.font=`${cam.z>0.12?12:10}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`; ctx.textAlign='center'; ctx.textBaseline='middle';
      LI.forEach(l=>{ if(lvl>0 && l!==focus && cam.z<0.2) return; ctx.fillStyle= l===focus||l===hoverLi ? 'rgba(245,242,238,.95)' : 'rgba(245,242,238,.45)'; ctx.fillText(l.name, sx(l.wc[0]), sy(l.wc[1])+(l.sites.length?10:0)); }); }
    /* 地點 */
    const pulse = RM?0:(Math.sin(now/420)+1)/2;
    pts.forEach(p=>{ if(play && p.t>play.cur) return; const X=sx(p.x), Y=sy(p.y); if(X<-20||Y<-20||X>Wd+20||Y>Ht+20) return; const dim = lvl>0 && focus && p.li!==focus; const r = Math.min(7, 2.2 + Math.min(4,p.s.n)*0.7 + cam.z*8); ctx.globalAlpha = dim?.18:1;
      if(p.s.n>1 && !dim){ ctx.beginPath(); ctx.arc(X,Y,r+3+pulse*4,0,7); ctx.strokeStyle=`rgba(245,242,238,${.35-pulse*.25})`; ctx.lineWidth=1; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(X,Y,r,0,7); if(p.ap){ ctx.strokeStyle=C; ctx.lineWidth=1.2; ctx.stroke(); } else { ctx.fillStyle=C; ctx.fill(); }
      if(p===sel||p===hover){ ctx.beginPath(); ctx.arc(X,Y,r+7,0,7); ctx.strokeStyle=C; ctx.lineWidth=1; ctx.stroke(); ctx.beginPath(); [[X-r-14,Y,X-r-7,Y],[X+r+7,Y,X+r+14,Y],[X,Y-r-14,X,Y-r-7],[X,Y+r+7,X,Y+r+14]].forEach(([a,b,c,d])=>{ctx.moveTo(a,b);ctx.lineTo(c,d);}); ctx.stroke(); }
      ctx.globalAlpha=1; });
  }
  /* 面板 */
  const cats = arr => { const c={}; arr.forEach(p=>c[p.s.cat]=(c[p.s.cat]||0)+1); return Object.entries(c).sort((a,b)=>b[1]-a[1]); };
  const liRow = l => `<li data-li="${esc(l.name)}"><span><b>${esc(l.name)}</b><br><small>${esc(l.dist)}${D.lizhang[l.dist]&&D.lizhang[l.dist][l.name]?'・里長 '+esc(D.lizhang[l.dist][l.name]):''}</small></span><em>${l.sites.length} 件</em></li>`;

    else { const s=sel.s; side.innerHTML=`<div class="k">${esc(s.dist)}${esc(s.li)}・${esc(s.cat)}</div><h2>${esc(s.title)}</h2>
      ${s.location?`<p>📍 ${esc(s.location)}${sel.ap?'（圖上為里內約略位置）':''}</p>`:''}
      ${s.thanks.length?`<p>感謝 ${s.thanks.map(n=>`<b>${esc(n)}</b>`).join('、')} 里長協助反映與陳情</p>`:(s.lizhang?`<p>${esc(s.li)}里長：${esc(s.lizhang)}</p>`:'')}
      <div class="nums"><div><b>${s.n}</b><small>次到場</small></div><div><b>${s.photos}</b><small>張照片</small></div><div><b>${s.first.slice(0,4)}</b><small>${s.n>1?'起追蹤':'年'}</small></div></div>
      <div class="det on">${detail(s)}</div><p><a class="btn line sm" href="#/local?q=${encodeURIComponent(s.title.slice(0,12))}" data-nav id="gmToList">在列表中查看</a></p>`; }
    crumbs.innerHTML = `<button data-lvl="0">西屯・南屯</button>${lvl>=1?`<i>›</i>${lvl===1?`<span class="cur">${esc(focus.name)}</span>`:`<button data-lvl="1">${esc(focus.name)}</button>`}`:''}${lvl===2?`<i>›</i><span class="cur">${esc(sel.s.title.slice(0,14))}${sel.s.title.length>14?'…':''}</span>`:''}`;
    side.scrollTop=0;
  }
  function goLi(l){ lvl=1; focus=l; sel=null; fit(l.sites.length?[Math.min(l.bb[0],...l.sites.map(p=>p.x-150)),Math.min(l.bb[1],...l.sites.map(p=>p.y-150)),Math.max(l.bb[2],...l.sites.map(p=>p.x+150)),Math.max(l.bb[3],...l.sites.map(p=>p.y+150))]:l.bb); panel(); }
  function goSite(p){ lvl=2; sel=p; focus=p.li||focus; const r=220; fit([p.x-r,p.y-r,p.x+r,p.y+r]); panel(); }
  function goRoot(){ lvl=0; focus=null; sel=null; fit(all); panel(); }
  function back(){ if(lvl===2) goLi(focus); else if(lvl===1) goRoot(); else close(); }
  function open(liName){ gm.classList.add('on'); document.body.style.overflow='hidden'; openedAt=performance.now(); drawP=RM?1:0; resize(); const l=liName&&liByName[liName]; if(l){ lvl=1; focus=l; Object.assign(cam,{x:(l.bb[0]+l.bb[2])/2,y:(l.bb[1]+l.bb[3])/2,z:0.05}); goLi(l); } else { lvl=0; Object.assign(cam,{x:(all[0]+all[2])/2,y:(all[1]+all[3])/2,z:0.02}); goRoot(); } requestAnimationFrame(()=>gm.classList.add('ready')); req(); }
  function close(){ gm.classList.remove('on','ready'); document.body.style.overflow=''; play=null; playBtn.textContent='▶ 播放時間軸'; yr.textContent=''; }
  /* 互動 */
  const hit = (X,Y) => { let best=null,bd=12; pts.forEach(p=>{ if(play && p.t>play.cur) return; if(lvl>0 && focus && p.li!==focus) return; const d=Math.hypot(sx(p.x)-X,sy(p.y)-Y); if(d<bd){bd=d;best=p;} }); return best; };
  const hitLi = (X,Y) => { const w=[wx(X),wy(Y)]; return LI.find(l=>w[0]>=l.bb[0]&&w[0]<=l.bb[2]&&w[1]>=l.bb[1]&&w[1]<=l.bb[3]&&pip(w,l.w))||null; };
  cv.addEventListener('pointermove',e=>{ if(dragging){ const dx=e.clientX-dragging.X, dy=e.clientY-dragging.Y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; cam.x=dragging.cx-dx/cam.z; cam.y=dragging.cy-dy/cam.z; req(); return; }
    const h=hit(e.clientX,e.clientY); hover=h; hoverLi=h?null:hitLi(e.clientX,e.clientY); cv.style.cursor=h||hoverLi?'pointer':'grab';
    if(h){ tip.style.display='block'; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.textContent=`${h.s.li||''} ${h.s.title}${h.s.n>1?`・${h.s.n}次`:''}`; } else if(hoverLi && lvl===0){ tip.style.display='block'; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.textContent=`${hoverLi.name}・${hoverLi.sites.length} 件`; } else tip.style.display='none'; req(); });
  cv.addEventListener('pointerdown',e=>{ dragging={X:e.clientX,Y:e.clientY,cx:cam.x,cy:cam.y}; moved=false; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; });
  cv.addEventListener('pointerup',e=>{ const wasDrag=moved; dragging=null; cv.style.cursor='grab'; if(wasDrag) return; const h=hit(e.clientX,e.clientY); if(h){ goSite(h); return; } const l=hitLi(e.clientX,e.clientY); if(l && l!==focus){ goLi(l); } else if(l && lvl===2){ goLi(l); } });
  cv.addEventListener('pointerleave',()=>{ hover=null; hoverLi=null; tip.style.display='none'; req(); });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0015); const X=e.clientX,Y=e.clientY, bx=wx(X), by=wy(Y); cam.z=Math.max(0.01,Math.min(3,cam.z*f)); cam.x=bx-(X-(Wd-sideW())/2)/cam.z; cam.y=by-(Y-(Ht-sideH())/2)/cam.z; anim=null; req(); },{passive:false});
  document.getElementById('gmZi').addEventListener('click',()=>{ cam.z=Math.min(3,cam.z*1.5); req(); });
  document.getElementById('gmZo').addEventListener('click',()=>{ cam.z=Math.max(0.01,cam.z/1.5); req(); });
  document.getElementById('gmClose').addEventListener('click',close);
  crumbs.addEventListener('click',e=>{ const b=e.target.closest('[data-lvl]'); if(!b) return; b.dataset.lvl==='0'?goRoot():goLi(focus); });
  side.addEventListener('click',e=>{ const pb=e.target.closest('[data-p]'); if(pb){ const all2=[...pb.parentElement.querySelectorAll('[data-p]')]; openLb(all2.map(b=>b.dataset.p), all2.indexOf(pb), pb.dataset.cap); return; }
    const ab=e.target.closest('[data-all]'); if(ab && sel){ const ev=sel.s.events.find(x=>String(x.id)===ab.dataset.all); if(ev){ openLb(ev.photos,8,`${ev.date}・${ev.core}`); } return; }
    const li=e.target.closest('[data-li]'); if(li){ goLi(liByName[li.dataset.li]); return; }
    const st=e.target.closest('[data-site]'); if(st){ const p=pts.find(p=>p.s.id===st.dataset.site); p&&goSite(p); return; }
    if(e.target.closest('#gmToList')) close(); });
  playBtn.addEventListener('click',()=>{ if(play){ play=null; playBtn.textContent='▶ 播放時間軸'; yr.textContent=''; req(); return; } if(lvl!==0) goRoot(); play={cur:T0,last:performance.now(),speed:(T1-T0)/9000}; playBtn.textContent='■ 停止'; req(); });
  if(initMap._h){ removeEventListener('keydown',initMap._h[0],true); removeEventListener('resize',initMap._h[1]); }
  initMap._h=[e=>{ if(!gm.classList.contains('on')||lb.classList.contains('on')) return; if(e.key==='Escape') back(); }, ()=>{ if(gm.classList.contains('on')) resize(); }];
  addEventListener('keydown',initMap._h[0],true); addEventListener('resize',initMap._h[1]);
  const card=document.getElementById('gmCard'); card&&card.addEventListener('click',e=>{ const b=e.target.closest('[data-li]'); open(b?b.dataset.li:''); });
  document.querySelectorAll('[data-open-map]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); open(b.dataset.openMap||''); }));
  return { open };
}

/* reveal + count-up */
let io;
function observe(){
  io && io.disconnect();
  io = new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); en.target.querySelectorAll('[data-count]').forEach(count); io.unobserve(en.target);} }); }, {threshold:.08, rootMargin:'0px 0px -4% 0px'});
  document.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el));
}
function count(el){
  if(el.dataset.done || reduce) return; el.dataset.done=1;
  const to = +el.dataset.count, t0 = performance.now(), dur = 900;
  const tick = now => { const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=num(Math.round(to*e)); if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* lightbox */
const lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'), lbCap=document.getElementById('lbCap');
let lbList=[], lbI=0, lbCapTxt='';
function showLb(){ lbImg.src=lbList[lbI]; lbCap.textContent=`${lbCapTxt}　${lbI+1} / ${lbList.length}`; }
function openLb(list,i,cap){ lbList=list; lbI=Math.min(i,list.length-1); lbCapTxt=cap||''; lb.classList.add('on'); showLb(); document.body.style.overflow='hidden'; }
function closeLb(){ lb.classList.remove('on'); lbImg.src=''; const g=document.getElementById('gm'); document.body.style.overflow=(g&&g.classList.contains('on'))?'hidden':''; }
document.getElementById('lbClose').addEventListener('click',closeLb);
document.getElementById('lbPrev').addEventListener('click',e=>{e.stopPropagation();lbI=(lbI-1+lbList.length)%lbList.length;showLb();});
document.getElementById('lbNext').addEventListener('click',e=>{e.stopPropagation();lbI=(lbI+1)%lbList.length;showLb();});
lb.addEventListener('click',e=>{ if(e.target===lb) closeLb(); });
addEventListener('keydown',e=>{ if(!lb.classList.contains('on')) return; if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') lbI=(lbI-1+lbList.length)%lbList.length; if(e.key==='ArrowRight') lbI=(lbI+1)%lbList.length; if(e.key.startsWith('Arrow')) showLb(); });

/* nav solid on scroll */
const nav = document.getElementById('nav');
addEventListener('scroll', ()=>nav.classList.toggle('solid', scrollY>20), {passive:true});

/* theme toggle */
const root = document.documentElement;
try{ const t=localStorage.getItem('theme'); if(t) root.dataset.theme=t; }catch(e){}
document.getElementById('theme').addEventListener('click', ()=>{
  const dark = root.dataset.theme==='dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'light' : 'dark';
  try{ localStorage.setItem('theme', root.dataset.theme); }catch(e){}
});

render(routeKey());
nav.classList.toggle('solid', scrollY>20);
</script>
